<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Gabriel Grassmann, Full Stack Developer">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .driftA { animation: driftA 14s ease-in-out infinite alternate; }
      .driftB { animation: driftB 18s ease-in-out infinite alternate; }
      .fade { animation: fade .8s ease-out both; }
      .d1 { animation-delay: .1s } .d2 { animation-delay: .35s } .d3 { animation-delay: .6s } .d4 { animation-delay: .9s }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes driftA { from { transform: translate(0,0) } to { transform: translate(90px,30px) } }
      @keyframes driftB { from { transform: translate(0,0) } to { transform: translate(-80px,-25px) } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0b0f19"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <ellipse class="driftA" cx="230" cy="40" rx="380" ry="230" fill="url(#glowA)"/>
    <ellipse class="driftB" cx="1020" cy="300" rx="380" ry="230" fill="url(#glowB)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="none" stroke="url(#edge)"/>

  <!-- intro -->
  <text x="64" y="92" class="mono fade d1" font-size="16" fill="#8b949e">~/goiania-br <tspan fill="#2563eb">$</tspan> whoami</text>
  <text x="62" y="156" class="sans fade d2" font-size="56" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Gabriel Grassmann</text>
  <text x="64" y="200" class="sans fade d3" font-size="26" font-weight="600" fill="url(#text)">Full Stack Developer</text>
  <text x="64" y="244" class="sans fade d4" font-size="17" fill="#8b949e">SaaS, sites de alta conversão e automações. Do zero ao deploy.</text>

  <!-- code window -->
  <g transform="translate(720 56)"><g class="fade d3">
    <rect width="420" height="208" rx="14" fill="#0d1117" fill-opacity="0.85" stroke="#30363d"/>
    <circle cx="22" cy="22" r="5.5" fill="#ff5f57"/>
    <circle cx="40" cy="22" r="5.5" fill="#febc2e"/>
    <circle cx="58" cy="22" r="5.5" fill="#28c840"/>
    <text x="210" y="27" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">gabriel.ts</text>
    <line x1="0" y1="42" x2="420" y2="42" stroke="#21262d"/>
    <g class="mono" font-size="14.5">
      <text x="22" y="72"><tspan fill="#ff7b72">const</tspan><tspan fill="#58a6ff"> gabriel</tspan><tspan fill="#c9d1d9"> = {</tspan></text>
      <text x="42" y="98"><tspan fill="#79c0ff">stack</tspan><tspan fill="#c9d1d9">: [</tspan><tspan fill="#a5d6ff">"Next.js"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"TS"</tspan><tspan fill="#c9d1d9">, </tspan><tspan fill="#a5d6ff">"Postgres"</tspan><tspan fill="#c9d1d9">],</tspan></text>
      <text x="42" y="124"><tspan fill="#79c0ff">building</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"Agenda Conexa"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="42" y="150"><tspan fill="#79c0ff">studying</tspan><tspan fill="#c9d1d9">: </tspan><tspan fill="#a5d6ff">"CC @ PUC Goiás"</tspan><tspan fill="#c9d1d9">,</tspan></text>
      <text x="22" y="176"><tspan fill="#c9d1d9">};</tspan><tspan class="cursor" fill="#2563eb"> ▍</tspan></text>
    </g>
  </g></g>
</svg>
